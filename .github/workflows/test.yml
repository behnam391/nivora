name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - run: node --check src/server.js
      - run: bash -n install.sh nivora.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Fetch pinned official libXray
        run: bash android/fetch-libxray.sh
      - name: Test and build customer and partner Android apps
        run: |
          chmod +x android/gradlew
          android/gradlew -p android \
            testCustomerDebugUnitTest \
            testPartnerDebugUnitTest \
            lintCustomerDebug \
            lintPartnerDebug \
            assembleCustomerDebug \
            assemblePartnerDebug
