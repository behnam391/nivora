name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare protected release signing key
        env:
          NIVORA_KEYSTORE_BASE64: ${{ secrets.NIVORA_KEYSTORE_BASE64 }}
        run: |
          test -n "$NIVORA_KEYSTORE_BASE64"
          printf '%s' "$NIVORA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nivora-release.jks"
          chmod 600 "$RUNNER_TEMP/nivora-release.jks"
      - name: Build signed Android app with pinned official libXray
        env:
          NIVORA_KEYSTORE_PATH: ${{ runner.temp }}/nivora-release.jks
          NIVORA_KEYSTORE_PASSWORD: ${{ secrets.NIVORA_KEYSTORE_PASSWORD }}
          NIVORA_KEY_ALIAS: nivora
          NIVORA_KEY_PASSWORD: ${{ secrets.NIVORA_KEYSTORE_PASSWORD }}
        run: |
          bash android/fetch-libxray.sh
          cd android
          chmod +x gradlew
          ./gradlew \
            app:testCustomerDebugUnitTest \
            app:testPartnerDebugUnitTest \
            app:lintCustomerRelease \
            app:lintPartnerRelease \
            app:assembleCustomerRelease \
            app:assemblePartnerRelease
          cp app/build/outputs/apk/customer/release/app-customer-arm64-v8a-release.apk ../Nivora-Customer-${GITHUB_REF_NAME}-arm64.apk
          cp app/build/outputs/apk/customer/release/app-customer-armeabi-v7a-release.apk ../Nivora-Customer-${GITHUB_REF_NAME}-armv7.apk
          cp app/build/outputs/apk/customer/release/app-customer-universal-release.apk ../Nivora-Customer-${GITHUB_REF_NAME}-universal.apk
          cp app/build/outputs/apk/partner/release/app-partner-arm64-v8a-release.apk ../Nivora-Partner-${GITHUB_REF_NAME}-arm64.apk
          cp app/build/outputs/apk/partner/release/app-partner-armeabi-v7a-release.apk ../Nivora-Partner-${GITHUB_REF_NAME}-armv7.apk
          cp app/build/outputs/apk/partner/release/app-partner-universal-release.apk ../Nivora-Partner-${GITHUB_REF_NAME}-universal.apk
          cd ..
          sha256sum Nivora-Customer-${GITHUB_REF_NAME}-*.apk Nivora-Partner-${GITHUB_REF_NAME}-*.apk > Nivora-${GITHUB_REF_NAME}-SHA256SUMS.txt
      - run: tar --exclude=.git --exclude=data --exclude=receipts --exclude=backups --exclude=.env -czf nivora-${GITHUB_REF_NAME}.tar.gz .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nivora-${{ github.ref_name }}.tar.gz
            Nivora-Customer-${{ github.ref_name }}-arm64.apk
            Nivora-Customer-${{ github.ref_name }}-armv7.apk
            Nivora-Customer-${{ github.ref_name }}-universal.apk
            Nivora-Partner-${{ github.ref_name }}-arm64.apk
            Nivora-Partner-${{ github.ref_name }}-armv7.apk
            Nivora-Partner-${{ github.ref_name }}-universal.apk
            Nivora-${{ github.ref_name }}-SHA256SUMS.txt
