name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android app with pinned official libXray
        run: |
          bash android/fetch-libxray.sh
          cd android
          chmod +x gradlew
          ./gradlew app:assembleDebug
      - run: tar --exclude=.git --exclude=data --exclude=receipts --exclude=backups --exclude=.env -czf nivora-${GITHUB_REF_NAME}.tar.gz .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nivora-${{ github.ref_name }}.tar.gz
            android/app/build/outputs/apk/debug/app-debug.apk
