<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب مشتری Nivora</title><link rel="icon" href="/brand-mark.svg"><link rel="stylesheet" href="/account.css"><link rel="stylesheet" href="/account-extra.css"><link rel="stylesheet" href="/brand.css"></head>
<body><main><header><a class="account-brand" href="/"><img src="/brand-mark.svg" alt="">Nivora</a><button id="logout" hidden>خروج</button></header>
<section id="auth" class="card"><h1>حساب مشتری</h1><div class="tabs"><button data-mode="login" class="active">ورود</button><button data-mode="register">ثبت‌نام</button></div><form id="auth-form"><label id="name-label" hidden>نام و نام خانوادگی<input id="name"></label><label>شماره موبایل<input id="phone" inputmode="numeric" pattern="09[0-9]{9}" required></label><label>رمز عبور<input id="password" type="password" minlength="8" required></label><button class="primary">ادامه</button><button id="forgot-password" type="button">رمز عبور را فراموش کرده‌ام</button><p id="auth-error" class="error"></p></form></section>
<section id="dashboard" hidden><div class="welcome"><div><small>حساب مشتری</small><h1 id="customer-name"></h1><button id="buy-plan" class="primary">خرید پلن از کیف پول</button></div><div class="wallet"><small>موجودی کیف پول</small><b><span id="balance">۰</span> تومان</b><button id="topup" class="primary">شارژ کیف پول با رسید</button></div></div><h2>اعلان‌ها</h2><div id="notifications" class="transactions"></div><h2>اشتراک‌های من</h2><div id="orders" class="orders"></div><h2>درخواست‌های شارژ</h2><div id="topups" class="transactions"></div><h2>پشتیبانی</h2><button id="new-ticket" class="primary">تیکت جدید</button><div id="tickets" class="transactions"></div><h2>گردش کیف پول</h2><div id="transactions" class="transactions"></div></section></main>
<dialog id="buy-dialog"><form id="buy-form"><h2>خرید از کیف پول</h2><label>انتخاب پلن<select id="plan" required></select></label><label>کد تخفیف<input id="discount-code" placeholder="اختیاری"></label><button type="button" id="validate-discount">بررسی کد</button><p id="plan-info"></p><button class="primary">خرید و ساخت فوری</button><button type="button" class="close">انصراف</button></form></dialog>
<dialog id="topup-dialog"><form id="topup-form"><h2>درخواست شارژ کیف پول</h2><div id="card-info"></div><label>مبلغ واریزی (تومان)<input id="topup-amount" type="number" min="1000" required></label><label>شماره پیگیری رسید<input id="topup-reference"></label><label>تصویر رسید<input id="topup-file" type="file" accept="image/jpeg,image/png,image/webp" required></label><button class="primary">ارسال برای بررسی</button><button type="button" class="close">انصراف</button></form></dialog>
<dialog id="ticket-dialog"><form id="ticket-form"><h2>تیکت پشتیبانی</h2><label>موضوع<input id="ticket-subject" required></label><label>پیام<textarea id="ticket-body" rows="5" required></textarea></label><button class="primary">ارسال تیکت</button><button type="button" class="close">انصراف</button></form></dialog>
<dialog id="password-reset-dialog"><form id="password-reset-form"><h2>بازیابی رمز عبور</h2><p>شماره موبایل حساب را وارد کنید. درخواست برای مدیر ارسال می‌شود.</p><label>شماره موبایل<input id="reset-phone" inputmode="numeric" pattern="09[0-9]{9}" required></label><button class="primary">ثبت درخواست</button><button type="button" class="close">انصراف</button><p id="reset-result"></p></form></dialog>
<div id="toast"></div><script src="/web-notifications.js" defer></script><script src="/account.js" defer></script><script src="/account-recovery.js" defer></script></body></html>
