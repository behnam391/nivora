<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nivora</title><style>
*{box-sizing:border-box}body{margin:0;background:#071c16;color:#e7f5ef;font-family:Segoe UI,Tahoma,sans-serif;overflow:hidden}button,input{font:inherit}button{cursor:pointer;border:0}.shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr;background:radial-gradient(circle at 84% 0,#104b3d 0,#071c16 42%)}.side{padding:30px 18px;border-left:1px solid #255346;background:#09271f;display:flex;flex-direction:column}.brand{font-size:27px;font-weight:900;letter-spacing:1px;color:#32dfaa}.brand small{display:block;font-size:11px;letter-spacing:0;color:#9fc7bb;margin-top:4px}.nav{margin-top:42px;display:grid;gap:8px}.nav button{background:transparent;color:#b8d3ca;text-align:right;padding:13px 14px;border-radius:14px;font-size:14px}.nav button.active,.nav button:hover{background:#123e33;color:#62efbf}.nav i{font-style:normal;margin-left:9px}.profile{margin-top:auto;padding:14px;border:1px solid #275748;border-radius:17px;background:#0d3128;color:#aac8be;font-size:12px}.profile b{display:block;color:#fff;margin-bottom:5px}.main{overflow:auto;padding:28px 44px 36px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:23px;margin:0}.top p{margin:7px 0 0;color:#93b8ab;font-size:13px}.ghost{background:#133e34;color:#d8eee6;padding:10px 15px;border-radius:12px}.hero{margin-top:26px;min-height:246px;border-radius:30px;padding:30px 36px;background:linear-gradient(135deg,#0c5a45,#11362d);position:relative;overflow:hidden;display:flex;align-items:center;gap:32px}.hero:after{content:"";position:absolute;left:-100px;bottom:-125px;width:330px;height:330px;border:46px solid #32dfaa18;border-radius:50%}.orb{width:128px;height:128px;border:12px solid #48e3b8;box-shadow:0 0 0 12px #48e3b81f,0 0 55px #35dca25c;border-radius:50%;display:grid;place-items:center;font-size:48px;z-index:1}.hero-text{z-index:1;flex:1}.eyebrow{color:#79edc2;font-weight:bold;font-size:13px}.hero h2{font-size:29px;margin:9px 0}.hero p{color:#cae9df;margin:0 0 20px}.route{width:min(460px,100%);background:#061e18;border:1px solid #3c7968;border-radius:14px;padding:12px;color:#e4f7ef}.actions{display:flex;gap:10px;margin-top:15px}.primary{background:#31d8a3;color:#06261e;padding:12px 26px;border-radius:13px;font-weight:800}.danger{background:#ffffff14;color:#fff;border:1px solid #ffffff42;padding:12px 26px;border-radius:13px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}.card{background:#0d2d25;border:1px solid #1b493d;border-radius:22px;padding:19px}.metric{color:#91bcb0;font-size:12px}.value{font-size:23px;font-weight:800;margin-top:9px}.green{color:#48e5b7}.section{display:flex;justify-content:space-between;align-items:end;margin:28px 0 13px}.section h3{margin:0;font-size:17px}.section span{color:#89ad9f;font-size:12px}.subs{display:grid;gap:12px}.sub{background:#0d2d25;border:1px solid #1b493d;border-radius:19px;padding:16px 18px;display:flex;align-items:center;gap:14px}.flag{font-size:28px;background:#143d32;padding:7px 10px;border-radius:13px}.sub b{display:block}.sub small{display:block;color:#94baad;margin-top:5px}.sub button{margin-right:auto;background:#1b5c49;color:#a9f5d7;padding:9px 13px;border-radius:10px}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#125b46,#071c16 55%)}.login-card{width:440px;max-width:calc(100% - 32px);background:#fff;color:#10261f;padding:32px;border-radius:28px;box-shadow:0 25px 80px #0007}.login-brand{text-align:center;color:#0e503e;font-weight:900;font-size:29px;margin-bottom:21px}.login h2{margin:0 0 7px}.login p{color:#668078;font-size:13px}.login label{display:block;color:#45645a;font-size:12px;font-weight:700;margin-top:16px}.login input{width:100%;margin-top:7px;padding:13px;border:1px solid #d6e6e0;border-radius:13px;text-align:right;outline:none}.login .primary{width:100%;margin-top:23px}.error{color:#d94752;font-size:12px;min-height:18px}.toast{position:fixed;left:28px;bottom:25px;background:#163d32;color:#fff;border:1px solid #347562;border-radius:13px;padding:12px 17px;display:none}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:22px}.hero{padding:24px;min-height:auto}.orb{width:85px;height:85px;font-size:34px}.quick{grid-template-columns:1fr}.sub button{display:none}}
html,body{height:100%}.shell{height:100vh;min-height:0}.main{min-height:0}.mobile-tabs{display:none}@media(max-width:760px){.main{padding:20px 18px 84px}.quick{grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px}.value{font-size:16px}.mobile-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;height:66px;background:#0b2b23;border-top:1px solid #255346;z-index:10}.mobile-tabs button{flex:1;background:transparent;color:#a4c4b8;font-size:11px}.mobile-tabs button.active{color:#4ce5b8}.tab-wallet .hero,.tab-wallet .quick,.tab-wallet .section,.tab-wallet .subs,.tab-subs .hero,.tab-subs .quick{display:none}.wallet-pane{display:none}.tab-wallet .wallet-pane{display:block}.wallet-pane .card{margin-top:25px}.tab-subs .section{margin-top:20px}}
</style></head><body><div id="app"><main class="login"><section class="login-card"><div class="login-brand">NIVORA</div><h2>خوش آمدید</h2><p>در حال آماده‌سازی فضای امن شما…</p><label>شماره موبایل<input inputmode="numeric" placeholder="۰۹۱۲..."/></label><label>رمز عبور<input type="password" placeholder="رمز عبور"/></label><button class="primary">ورود به Nivora</button></section></main></div><div id="toast" class="toast"></div><script>window.onerror=function(m){document.querySelector('.login p').textContent='خطای رابط: '+m}</script><script>
const $=s=>document.querySelector(s), app=$('#app');let token='',account=null,connected=false;try{token=localStorage.nivoraToken||''}catch(_){}const saveToken=x=>{token=x;try{localStorage.nivoraToken=x}catch(_){}};const clearToken=()=>{token='';try{localStorage.removeItem('nivoraToken')}catch(_){}};const nativeBridge=window.chrome&&window.chrome.webview;const send=x=>{if(nativeBridge)nativeBridge.postMessage(JSON.stringify(x));else toast('ارتباط داخلی برنامه آماده نشد؛ برنامه را یک‌بار ببندید و باز کنید.')};
function toast(t){let x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',3000)}function fa(n){return (+n||0).toLocaleString('fa-IR')}function flag(c){return ({FI:'🇫🇮',DE:'🇩🇪',NL:'🇳🇱',FR:'🇫🇷',TR:'🇹🇷',AE:'🇦🇪',US:'🇺🇸',GB:'🇬🇧'})[c]||'🌐'}function subscriptionName(o){return o.location_name||o.plan_name||'اشتراک Nivora'}
function login(){app.innerHTML=`<main class="login"><section class="login-card"><div class="login-brand">NIVORA</div><h2>خوش آمدید</h2><p>برای مدیریت و اتصال اشتراک وارد شوید.</p><label>شماره موبایل<input id="phone" inputmode="numeric" placeholder="۰۹۱۲..."/></label><label>رمز عبور<input id="pass" type="password" placeholder="رمز عبور"/></label><div id="err" class="error"></div><button class="primary" id="enter">ورود به Nivora</button></section></main>`;$('#enter').onclick=()=>send({action:'login',phone:$('#phone').value,password:$('#pass').value})}
function dashboard(){let orders=(account.orders||[]).filter(x=>x.subscription_status==='active'&&x.subscription_url);let name=account.name||'کاربر Nivora';let bal=account.balanceToman||0;app.innerHTML=`<div class="shell home"><aside class="side"><div class="brand">NIVORA<small>اتصال امن و هوشمند</small></div><nav class="nav"><button class="active">⌂ <i>خانه و اتصال</i></button><button>◈ <i>پلن‌ها</i></button><button>▣ <i>کیف پول</i></button><button>◌ <i>پشتیبانی</i></button></nav><div class="profile"><b>${name}</b>${orders.length} اشتراک فعال<br><button class="ghost" id="out" style="margin-top:10px;width:100%">خروج از حساب</button></div></aside><main class="main"><header class="top"><div><h1>سلام ${name}</h1><p>به مرکز اتصال Nivora خوش آمدید</p></div><button class="ghost" id="refresh">↻</button></header><section class="hero"><div class="orb">${connected?'✓':'⏻'}</div><div class="hero-text"><span class="eyebrow">${connected?'اتصال برقرار است':'SMART CONNECT'}</span><h2>${connected?'متصل و امن':'آمادهٔ اتصال'}</h2><p>${connected?'پراکسی سیستم فعال است.':'بهترین مسیر اشتراک خود را انتخاب کنید.'}</p><select class="route" id="route">${orders.map((o,i)=>`<option value="${i}">${flag(o.country_code)} ${subscriptionName(o)}</option>`).join('')||'<option>اشتراک فعالی ندارید</option>'}</select><div class="actions"><button class="primary" id="connect">${connected?'متصل':'اتصال امن'}</button><button class="danger" id="disconnect">قطع</button></div></div></section><section class="quick"><div class="card"><div class="metric">کیف پول</div><div class="value green">${fa(bal)} تومان</div></div><div class="card"><div class="metric">سرویس</div><div class="value">${orders.length} فعال</div></div></section><section class="wallet-pane"><div class="card"><div class="metric">موجودی کیف پول</div><div class="value green">${fa(bal)} تومان</div><p style="color:#a8c7bc;font-size:12px">برای شارژ کیف پول و ارسال رسید از بخش حساب کاربری استفاده کنید.</p></div></section><div class="section"><div><h3>اشتراک‌های من</h3><span>برای اتصال، یکی را انتخاب کنید</span></div></div><section class="subs">${orders.map((o,i)=>`<article class="sub"><div class="flag">${flag(o.country_code)}</div><div><b>${subscriptionName(o)}</b><small>فعال · مسیر هوشمند Nivora</small></div><button data-i="${i}">انتخاب</button></article>`).join('')||'<div class="card">اشتراک فعالی برای این حساب وجود ندارد.</div>'}</section></main><nav class="mobile-tabs"><button data-tab="home" class="active">⌂<br>خانه</button><button data-tab="subs">◈<br>اشتراک‌ها</button><button data-tab="wallet">▣<br>کیف پول</button></nav></div>`;$('#refresh').onclick=()=>send({action:'refresh',token});$('#out').onclick=()=>{clearToken();login()};$('#connect').onclick=()=>{let o=orders[$('#route').value];if(o)send({action:'connect',url:o.subscription_url})};$('#disconnect').onclick=()=>send({action:'disconnect'});document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{$('#route').value=b.dataset.i;toast('مسیر انتخاب شد')});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{let v=b.dataset.tab,s=document.querySelector('.shell');s.className='shell tab-'+v;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('.main').scrollTop=0})}
if(nativeBridge)nativeBridge.addEventListener('message',e=>{let m=e.data;if(m.type==='session'){saveToken(m.payload.token)}else if(m.type==='account'){account=m.payload;dashboard()}else if(m.type==='state'){connected=m.payload.connected;dashboard();toast(m.payload.message)}else if(m.type==='error'){let x=$('#err');if(x)x.textContent=m.payload.message;else toast(m.payload.message)}else if(m.type==='expired'){clearToken();login()}});login();if(token)send({action:'refresh',token});
</script></body></html>
