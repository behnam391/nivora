<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nivora</title>
  <style>
    :root{color-scheme:dark;--bg:#030817;--surface:rgba(12,24,55,.76);--line:rgba(118,181,255,.18);--blue:#2b8cff;--cyan:#39ddff;--text:#f4f8ff;--muted:#9aafd1;--danger:#ff6f91;--shadow:0 24px 80px rgba(0,0,0,.38)}
    *{box-sizing:border-box}html,body,#app{height:100%}body{margin:0;min-width:390px;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer}.page{height:100%;position:relative;overflow:hidden;background:radial-gradient(circle at 12% 4%,rgba(43,140,255,.27),transparent 35%),radial-gradient(circle at 92% 54%,rgba(57,221,255,.11),transparent 40%),linear-gradient(165deg,#040918,#07132d)}.page:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.3;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:28px 28px}.content{position:relative;height:100%;overflow:auto;padding:22px 22px 92px;scrollbar-width:thin;scrollbar-color:#284d7d transparent}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.identity{display:flex;align-items:center;gap:10px}.identity b{display:block;font-size:18px;letter-spacing:1.5px}.identity small{display:block;color:var(--muted);font-size:9px}.logo{width:46px;height:46px;filter:drop-shadow(0 8px 18px rgba(43,140,255,.36))}.icon-button{width:39px;height:39px;border:1px solid var(--line);border-radius:13px;background:rgba(11,25,58,.65);color:#d9eaff}.glass{border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(18px);box-shadow:var(--shadow)}
    .connect-card{position:relative;overflow:hidden;border-radius:29px;padding:24px;text-align:center}.connect-card:after{content:"";position:absolute;inset:auto -30% -58% -30%;height:72%;background:radial-gradient(ellipse,rgba(43,140,255,.32),transparent 65%);pointer-events:none}.connection-orb{position:relative;width:142px;height:142px;margin:4px auto 16px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(29,73,149,.72),rgba(5,14,35,.95) 62%);border:1px solid rgba(103,191,255,.42);box-shadow:inset 0 0 35px rgba(35,132,255,.28),0 0 0 9px rgba(43,140,255,.05),0 20px 60px rgba(0,90,255,.25)}.connection-orb:before,.connection-orb:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(57,221,255,.3);inset:12px}.connection-orb:after{inset:-9px;border-color:rgba(43,140,255,.2);border-top-color:var(--cyan);animation:spin 3s linear infinite}.connected .connection-orb{box-shadow:inset 0 0 42px rgba(57,221,255,.32),0 0 0 9px rgba(57,221,255,.06),0 20px 70px rgba(0,163,255,.35)}.orb-logo{width:80px;height:80px}.hero-logo{width:80px;height:80px}.connect-card h1{font-size:25px;margin:0 0 5px}.connect-card>p{margin:0 0 17px;color:var(--muted);font-size:11px}.route{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:#071126;color:#edf7ff;outline:none}.actions{display:grid;grid-template-columns:1fr .42fr;gap:9px;margin-top:11px;position:relative;z-index:1}.primary,.secondary,.danger{min-height:44px;border-radius:13px;font-weight:800}.primary{background:linear-gradient(125deg,var(--blue),var(--cyan));color:#031024;box-shadow:0 12px 28px rgba(43,140,255,.28)}.secondary{border:1px solid var(--line);background:rgba(30,58,104,.52);color:#dceaff}.danger{border:1px solid rgba(255,111,145,.25);background:rgba(255,111,145,.08);color:#ff9bb1}.primary:disabled{opacity:.55;cursor:wait}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.metric{padding:14px;border-radius:18px}.metric small{display:block;color:var(--muted);font-size:9px}.metric b{display:block;margin-top:5px;font-size:16px}.accent{color:var(--cyan)}.section-title{display:flex;align-items:center;justify-content:space-between;margin:19px 2px 10px}.section-title h2{font-size:15px;margin:0}.section-title span{color:var(--muted);font-size:9px}.list{display:grid;gap:8px}.subscription{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;padding:13px;border-radius:17px}.flag{width:39px;height:39px;display:grid;place-items:center;border-radius:12px;background:rgba(43,140,255,.12);font-size:21px}.subscription b{display:block;font-size:12px}.subscription small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.subscription button{padding:7px 10px;border-radius:10px;background:rgba(57,221,255,.1);color:#aeefff;font-size:9px}.empty{padding:24px;text-align:center;border-radius:18px;color:var(--muted);font-size:11px}.account-card{padding:18px;border-radius:21px;margin-top:12px}.account-card h2{font-size:17px;margin:0 0 4px}.account-card p{font-size:10px;color:var(--muted);margin:0 0 15px}.account-actions{display:grid;gap:8px}.account-actions button{width:100%}.screen{display:none}.screen.active{display:block}.bottom-nav{position:absolute;z-index:8;bottom:13px;left:18px;right:18px;height:64px;display:grid;grid-template-columns:repeat(3,1fr);padding:6px;border-radius:19px}.bottom-nav button{border-radius:14px;background:transparent;color:#8098bd;font-size:9px}.bottom-nav button b{display:block;font-size:17px;line-height:20px}.bottom-nav button.active{background:rgba(43,140,255,.15);color:#dff7ff}
    .login{height:100%;display:grid;place-items:center;padding:22px;position:relative;background:radial-gradient(circle at 50% 2%,rgba(43,140,255,.35),transparent 40%),linear-gradient(165deg,#030713,#07142d)}.login-card{width:100%;max-width:420px;border-radius:30px;padding:28px}.login-brand{text-align:center}.login-brand .logo{width:90px;height:90px}.login-brand h1{letter-spacing:4px;margin:4px 0 0}.login-brand p{color:var(--muted);font-size:10px;margin:5px 0 20px}.login label{display:block;color:#c6d6ee;font-size:10px;font-weight:700;margin-top:12px}.login input{width:100%;margin-top:7px;padding:13px;border:1px solid var(--line);border-radius:13px;background:#071126;color:#fff;text-align:right;outline:none}.login input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(57,221,255,.1)}.login .primary{width:100%;margin-top:18px}.error{min-height:20px;margin-top:10px;color:var(--danger);font-size:10px}.version{text-align:center;color:#52698d;font-size:8px;margin-top:13px}.toast{position:fixed;z-index:30;left:20px;right:20px;bottom:90px;padding:12px 14px;border:1px solid rgba(57,221,255,.22);border-radius:13px;background:#10254a;color:#fff;box-shadow:var(--shadow);font-size:10px;text-align:center;opacity:0;transform:translateY(20px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div id="app"></div><div id="toast" class="toast" role="status"></div>
  <script>
    const $=selector=>document.querySelector(selector),app=$('#app');
    const bridge=window.chrome&&window.chrome.webview;
    let token='',account=null,connected=false,busy=false,activeTab='home';
    try{token=localStorage.nivoraToken||''}catch{}
    const esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const fa=value=>new Intl.NumberFormat('fa-IR').format(Number(value)||0);
    const flag=code=>({FI:'🇫🇮',DE:'🇩🇪',NL:'🇳🇱',FR:'🇫🇷',TR:'🇹🇷',AE:'🇦🇪',US:'🇺🇸',GB:'🇬🇧'})[String(code||'').toUpperCase()]||'🌐';
    const nameOf=order=>order.location_name||order.plan_name||'اشتراک Nivora';
    const logo=()=>`<svg class="logo" viewBox="0 0 120 120" aria-label="Nivora"><defs><linearGradient id="n1" x1="15" y1="10" x2="105" y2="108"><stop stop-color="#eaf8ff"/><stop offset=".28" stop-color="#58dcff"/><stop offset=".62" stop-color="#176cff"/><stop offset="1" stop-color="#082376"/></linearGradient><radialGradient id="n2"><stop stop-color="#1dcfff"/><stop offset="1" stop-color="#05245f"/></radialGradient></defs><rect x="4" y="4" width="112" height="112" rx="29" fill="#06132f" stroke="#278dff" stroke-width="3"/><circle cx="62" cy="52" r="37" fill="url(#n2)" opacity=".82"/><path d="M24 91V29c0-9 11-13 17-6l45 51V34c0-7 5-12 12-12h2v65c0 10-13 15-19 7L43 51v28c0 8-6 14-14 14h-5Z" fill="url(#n1)"/><path d="M18 65c25 17 61 20 89-4" fill="none" stroke="#54e6ff" stroke-width="4" stroke-linecap="round"/></svg>`;
    function send(message){if(bridge)bridge.postMessage(JSON.stringify(message));else showToast('ارتباط داخلی برنامه آماده نیست؛ برنامه را یک‌بار ببندید و باز کنید.')}
    function saveToken(value){token=value;try{localStorage.nivoraToken=value}catch{}}
    function clearToken(){token='';try{localStorage.removeItem('nivoraToken')}catch{}}
    function showToast(message){const node=$('#toast');node.textContent=message;node.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>node.classList.remove('show'),2800)}
    function login(){app.innerHTML=`<main class="login"><section class="login-card glass"><div class="login-brand">${logo()}<h1>NIVORA</h1><p>اتصال سریع، ساده و امن روی ویندوز</p></div><label>شماره موبایل<input id="phone" inputmode="numeric" maxlength="11" placeholder="09123456789" autocomplete="username"></label><label>رمز عبور<input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password"></label><div id="login-error" class="error"></div><button id="login-button" class="primary">ورود به حساب</button><div class="version">Nivora Desktop 1.1.0</div></section></main>`;$('#login-button').onclick=()=>{if(busy)return;const phone=$('#phone').value.trim(),password=$('#password').value;if(!/^09\d{9}$/.test(phone)||password.length<8){$('#login-error').textContent='شماره موبایل یا رمز عبور کامل نیست.';return}busy=true;$('#login-button').disabled=true;$('#login-button').textContent='در حال ورود…';send({action:'login',phone,password})};$('#password').onkeydown=event=>{if(event.key==='Enter')$('#login-button').click()}}
    function dashboard(){
      const orders=(account.orders||[]).filter(order=>order.subscription_status==='active'&&order.control_status==='active'&&order.subscription_url),displayName=esc(account.name||'کاربر Nivora'),balance=account.balanceToman||0;
      app.innerHTML=`<div class="page ${connected?'connected':''}"><div class="content"><header class="topbar"><div class="identity">${logo()}<span><b>NIVORA</b><small>${displayName}</small></span></div><button id="refresh" class="icon-button">↻</button></header><section class="screen ${activeTab==='home'?'active':''}"><article class="connect-card glass"><div class="connection-orb"><div class="hero-logo">${logo()}</div></div><h1>${connected?'اتصال برقرار است':'آماده اتصال'}</h1><p>${connected?'پراکسی امن Nivora روی ویندوز فعال است.':'یک اشتراک انتخاب کنید و دکمه اتصال را بزنید.'}</p><select id="route" class="route" ${orders.length?'':'disabled'}>${orders.map((order,index)=>`<option value="${index}">${flag(order.country_code)} ${esc(nameOf(order))}</option>`).join('')||'<option>اشتراک فعالی ندارید</option>'}</select><div class="actions"><button id="connect" class="primary" ${orders.length&&!connected?'':'disabled'}>${connected?'متصل است':'اتصال هوشمند'}</button><button id="disconnect" class="danger" ${connected?'':'disabled'}>قطع</button></div></article><section class="metrics"><article class="metric glass"><small>موجودی کیف پول</small><b class="accent">${fa(balance)} تومان</b></article><article class="metric glass"><small>اشتراک فعال</small><b>${fa(orders.length)} سرویس</b></article></section></section><section class="screen ${activeTab==='subscriptions'?'active':''}"><div class="section-title"><div><h2>اشتراک‌های من</h2><span>مسیر موردنظر را انتخاب کنید</span></div></div><div class="list">${orders.map((order,index)=>`<article class="subscription glass"><div class="flag">${flag(order.country_code)}</div><div><b>${esc(nameOf(order))}</b><small>${fa(order.remainingDays||order.duration_days)} روز مانده · ${fa(order.traffic_gb)} گیگ</small></div><button data-select="${index}">انتخاب</button></article>`).join('')||'<div class="empty glass">اشتراک فعالی برای این حساب وجود ندارد.</div>'}</div></section><section class="screen ${activeTab==='account'?'active':''}"><article class="account-card glass"><h2>${displayName}</h2><p>${esc(account.phone||'')} · مدیریت مالی و پشتیبانی حساب</p><div class="account-actions"><button class="primary" data-open="wallet">کیف پول و خرید اشتراک</button><button class="secondary" data-open="support">پشتیبانی و تیکت‌ها</button><button id="logout" class="danger">خروج از حساب</button></div></article></section></div><nav class="bottom-nav glass"><button data-tab="home" class="${activeTab==='home'?'active':''}"><b>◉</b>اتصال</button><button data-tab="subscriptions" class="${activeTab==='subscriptions'?'active':''}"><b>◈</b>اشتراک‌ها</button><button data-tab="account" class="${activeTab==='account'?'active':''}"><b>♙</b>حساب</button></nav></div>`;
      $('#refresh').onclick=()=>send({action:'refresh',token});$('#connect').onclick=()=>{const order=orders[Number($('#route').value)];if(!order||busy)return;busy=true;$('#connect').disabled=true;$('#connect').textContent='در حال اتصال…';send({action:'connect',url:order.subscription_url})};$('#disconnect').onclick=()=>send({action:'disconnect'});
      document.querySelectorAll('[data-select]').forEach(button=>button.onclick=()=>{activeTab='home';dashboard();$('#route').value=button.dataset.select;showToast('اشتراک برای اتصال انتخاب شد.')});document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{activeTab=button.dataset.tab;dashboard()});document.querySelectorAll('[data-open]').forEach(button=>button.onclick=()=>send({action:'openAccount',section:button.dataset.open}));const logout=$('#logout');if(logout)logout.onclick=()=>{send({action:'disconnect'});clearToken();account=null;connected=false;login()}
    }
    if(bridge)bridge.addEventListener('message',event=>{const message=event.data;busy=false;if(message.type==='session')saveToken(message.payload.token);else if(message.type==='account'){account=message.payload;dashboard()}else if(message.type==='state'){connected=Boolean(message.payload.connected);dashboard();showToast(message.payload.message)}else if(message.type==='error'){const error=$('#login-error');if(error){error.textContent=message.payload.message;const button=$('#login-button');if(button){button.disabled=false;button.textContent='ورود به حساب'}}else{dashboard();showToast(message.payload.message)}}else if(message.type==='expired'){clearToken();account=null;login()}});
    login();if(token)send({action:'refresh',token});
  </script>
</body>
</html>
