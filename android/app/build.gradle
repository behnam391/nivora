apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'ir.nivora.app'
    compileSdk 36
    defaultConfig {
        applicationId 'ir.nivora.app'
        minSdk 26
        targetSdk 36
        versionCode 49
        versionName '0.23.3'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        def apiUrl = providers.gradleProperty('NIVORA_API_BASE_URL').getOrElse('https://api.nivorali.com')
        def neuralMeshPublicKey = providers.gradleProperty('NEURALMESH_PUBLIC_KEY_SPKI').getOrElse('')
        buildConfigField 'String', 'API_BASE_URL', '"' + apiUrl + '"'
        buildConfigField 'String', 'NEURALMESH_PUBLIC_KEY_SPKI', '"' + neuralMeshPublicKey + '"'
    }
    flavorDimensions 'audience'
    productFlavors {
        customer {
            dimension 'audience'
            buildConfigField 'String', 'APP_AUDIENCE', '"customer"'
            resValue 'string', 'app_name', 'Nivora'
        }
        partner {
            dimension 'audience'
            applicationIdSuffix '.partner'
            versionNameSuffix '-partner'
            buildConfigField 'String', 'APP_AUDIENCE', '"partner"'
            resValue 'string', 'app_name', 'Nivora Partner'
        }
    }
    def releaseStore = System.getenv('NIVORA_KEYSTORE_PATH')
    def releaseStorePassword = System.getenv('NIVORA_KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('NIVORA_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('NIVORA_KEY_PASSWORD')
    signingConfigs {
        if (releaseStore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            nivoraRelease {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField 'boolean', 'NETWORK_LAB_ENABLED', 'true'
        }
        release {
            buildConfigField 'boolean', 'NETWORK_LAB_ENABLED', 'false'
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName('nivoraRelease')) signingConfig signingConfigs.nivoraRelease
        }
        research {
            initWith debug
            applicationIdSuffix '.research'
            versionNameSuffix '-research'
            buildConfigField 'boolean', 'NETWORK_LAB_ENABLED', 'true'
            matchingFallbacks = ['debug']
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true; compose true }
}

dependencies {
    // The reseller app has no tunnel surface or VPN service. Keep Xray on the
    // compile classpath for shared source, but package its large native core
    // only in customer variants.
    compileOnly files('libs/libXray-26.7.28.aar')
    customerImplementation files('libs/libXray-26.7.28.aar')
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.3.1'
    // Biometric 1.1 pulls an obsolete Fragment transitively; Activity Result
    // APIs require Fragment 1.3+ and release lint correctly rejects the old one.
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.runtime:runtime-saveable'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
}
